<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Outer frame -->
  <rect x="25" y="25" width="750" height="450" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Central Badge/Icon -->
  <g transform="translate(400, 200)">
    <!-- Circle Glow -->
    <circle r="52" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <circle r="44" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.4" />
    
    <!-- Camera / Picture Icon with subtle Gold Accent -->
    <path d="M -22 -10 L -14 -18 L 14 -18 L 22 -10 L 26 -10 C 30 -10 33 -7 33 -3 L 33 20 C 33 24 30 27 26 27 L -26 27 C -30 27 -33 24 -33 20 L -33 -3 C -33 -7 -30 -10 -26 -10 Z" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="0" cy="8" r="11" fill="none" stroke="url(#gold)" stroke-width="2.5" />
    <circle cx="20" cy="-3" r="2.5" fill="#f59e0b" />
  </g>

  <!-- Brand Typography -->
  <text x="400" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="4" fill="#ffffff">
    STUDIO BP
  </text>
  
  <text x="400" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="3" fill="#f59e0b">
    IMMOBILIARE &#38; AZIENDE
  </text>

  <!-- Status subtitle -->
  <rect x="300" y="355" width="200" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="316" cy="369" r="4" fill="#f59e0b" />
  <text x="406" y="373" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#94a3b8">
    Immagine in aggiornamento
  </text>
</svg>
